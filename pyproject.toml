[project]
name = "promise-tracker"
version = "0.1.0"
description = "Extract commitments from a conversation and turn the confirmed ones into calendar reminders"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings and comments is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
